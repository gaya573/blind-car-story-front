<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="스톱워치">
  <defs>
    <linearGradient id="bcsGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7e6a8" />
      <stop offset="35%" stop-color="#e5c96a" />
      <stop offset="65%" stop-color="#c9a227" />
      <stop offset="100%" stop-color="#8a6a12" />
    </linearGradient>
    <linearGradient id="bcsBody" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#3a3a3a" />
      <stop offset="55%" stop-color="#1c1c1c" />
      <stop offset="100%" stop-color="#0b0b0b" />
    </linearGradient>
    <radialGradient id="bcsDial" cx="0.38" cy="0.3" r="0.85">
      <stop offset="0%" stop-color="#2e2e2e" />
      <stop offset="70%" stop-color="#161616" />
      <stop offset="100%" stop-color="#0d0d0d" />
    </radialGradient>
  </defs>

  <!-- 스피드 라인 -->
  <g fill="url(#bcsGold)">
    <rect x="18" y="88" width="66" height="13" rx="6.5" opacity="0.55" />
    <rect x="0" y="120" width="92" height="15" rx="7.5" opacity="0.9" />
    <rect x="26" y="156" width="58" height="12" rx="6" opacity="0.45" />
  </g>

  <!-- 용두 -->
  <rect x="128" y="46" width="26" height="20" rx="5" fill="#151515" />
  <rect x="112" y="20" width="58" height="28" rx="14" fill="url(#bcsGold)" />
  <!-- 사이드 버튼 -->
  <g transform="rotate(38 200 66)">
    <rect x="184" y="52" width="30" height="24" rx="11" fill="url(#bcsGold)" />
  </g>

  <!-- 본체 -->
  <circle cx="141" cy="140" r="88" fill="url(#bcsBody)" />
  <circle cx="141" cy="140" r="82" fill="none" stroke="url(#bcsGold)" stroke-width="9" />
  <circle cx="141" cy="140" r="71" fill="url(#bcsDial)" />

  <!-- 눈금 -->
  <g stroke="#f4ead0" stroke-linecap="round">
    <line x1="141" y1="78" x2="141" y2="92" stroke-width="6" />
    <line x1="203" y1="140" x2="189" y2="140" stroke-width="6" />
    <line x1="141" y1="202" x2="141" y2="188" stroke-width="6" />
    <line x1="79" y1="140" x2="93" y2="140" stroke-width="6" />
    <g stroke-width="4" opacity="0.85">
      <line x1="172" y1="86.5" x2="167" y2="95" />
      <line x1="194.5" y1="109" x2="186" y2="114" />
      <line x1="194.5" y1="171" x2="186" y2="166" />
      <line x1="172" y1="193.5" x2="167" y2="185" />
      <line x1="110" y1="193.5" x2="115" y2="185" />
      <line x1="87.5" y1="171" x2="96" y2="166" />
      <line x1="87.5" y1="109" x2="96" y2="114" />
      <line x1="110" y1="86.5" x2="115" y2="95" />
    </g>
  </g>

  <!-- 바늘 -->
  <g stroke="#f4ead0" stroke-linecap="round" fill="none">
    <line x1="141" y1="140" x2="112" y2="112" stroke-width="10" />
    <line x1="141" y1="140" x2="181" y2="119" stroke-width="9" />
  </g>
  <circle cx="141" cy="140" r="9" fill="url(#bcsGold)" />
  <circle cx="141" cy="140" r="3.5" fill="#141414" />
</svg>
